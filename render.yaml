services:
  - type: web
    name: ows-grow-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/grow.db
      # פרטי תיבת המייל — נכנסים ידנית בלוח הבקרה של Render, לא כאן בקובץ:
      #   IMAP_USER = כתובת הג'ימייל
      #   IMAP_PASS = סיסמת אפליקציה (myaccount.google.com/apppasswords)
      # וכן ADMIN_EMAIL / ADMIN_PASSWORD לכניסה לדשבורד.
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: ows-grow-data
      mountPath: /var/data
      sizeGB: 1
