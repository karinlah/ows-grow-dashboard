services:
  - type: web
    name: ows-grow-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # גרסת Node מוצמדת בכוונה.
      # ברירת המחדל של Render לשירותים חדשים (24.21.0) מפילה את
      # better-sqlite3 ב-SIGABRT על כל statement שנהרס:
      #   Assertion failed: (env) != nullptr  ->  Statement::~Statement()
      # 24.14.1 היא הגרסה ש-ows-crm רץ עליה בהצלחה עם אותה ספרייה.
      # לשחרור ההצמדה צריך קודם לשדרג את better-sqlite3 ולבדוק.
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/grow.db
      # פרטי תיבת המייל — נכנסים ידנית בלוח הבקרה של Render, לא כאן בקובץ:
      #   IMAP_USER = כתובת הג'ימייל
      #   IMAP_PASS = סיסמת אפליקציה (myaccount.google.com/apppasswords)
      # וכן ADMIN_EMAIL / ADMIN_PASSWORD לכניסה לדשבורד.
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: ows-grow-data
      mountPath: /var/data
      sizeGB: 1
