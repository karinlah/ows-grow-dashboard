<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>כניסה — דשבורד הרשמות OWS</title>
  <link rel="icon" href="/images/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img src="/images/wordmark-h-cream.svg" alt="ONE WOMAN SHOW">
    <h1>דשבורד הרשמות</h1>
    <p class="sub">הרשמות והכנסות מ-Grow</p>

    <form id="login-form" autocomplete="on">
      <input type="email" id="email" placeholder="אימייל" required autocomplete="username">
      <input type="password" id="password" placeholder="סיסמה" required autocomplete="current-password">
      <button type="submit" class="btn" id="submit">כניסה</button>
      <p class="login-error" id="error"></p>
    </form>
  </main>
  <script src="/js/login.js"></script>
</body>
</html>
